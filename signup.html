<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melbet - Sign Up</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f141c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .signup-container {
            width: 90%;
            max-width: 400px;
            background: #18222d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #223041;
        }
        .logo-text {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #8b9bb4;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #223041;
            border-radius: 5px;
            background: #223041;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #ff0000;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #8b9bb4;
        }
        .login-link a {
            color: #e6c619;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="logo-text">MELBET</div>
        
        <form onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Mobile Number (Active)</label>
                <input type="tel" id="signupPhone" placeholder="01XXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label>Bkash / Nagad Number</label>
                <input type="tel" id="signupBkash" placeholder="Your payment number" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password" required>
            </div>

            <button type="submit" class="submit-btn">SIGN UP</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            
            let email = document.getElementById('signupEmail').value;
            let phone = document.getElementById('signupPhone').value;
            let bkash = document.getElementById('signupBkash').value;
            let password = document.getElementById('signupPassword').value;

            // ইউজারের তথ্য লোকাল স্টোরেজে সেভ করা হলো (যা পরবর্তীতে এজেন্ট প্যানেলে শো করবে)
            let userData = { email, phone, bkash, password };
            localStorage.setItem('registeredUser', JSON.stringify(userData));

            alert("Registration Successful! Please login now.");
            
            // সাইন আপ সফল হওয়ার পর সরাসরি লগইন পেজে পাঠিয়ে দেবে
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
