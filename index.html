<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melbet - Home Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f141c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            background: #18222d;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid #223041;
        }
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            letter-spacing: 2px;
        }
        .balance-box {
            background: #223041;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            color: #e6c619;
            font-weight: bold;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            color: white;
        }
        .deposit-btn {
            background-color: #28a745;
        }
        .deposit-btn:hover {
            background-color: #218838;
        }
        .withdraw-btn {
            background-color: #ff4d4d;
        }
        .withdraw-btn:hover {
            background-color: #cc0000;
        }
        .game-card {
            background: #18222d;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #223041;
        }
        .game-info h3 {
            margin: 0 0 5px 0;
            color: #e6c619;
        }
        .game-info p {
            margin: 0;
            font-size: 14px;
            color: #8b9bb4;
        }
        .play-btn {
            background-color: #ff0000;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.2s;
        }
        .play-btn:hover {
            background-color: #cc0000;
        }
        .logout-section {
            margin-top: 30px;
            text-align: center;
        }
        .logout-btn {
            color: #8b9bb4;
            text-decoration: none;
            font-size: 14px;
        }
        .logout-btn:hover {
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <!-- টপ হেডার (লোগো এবং ব্যালেন্স) -->
    <div class="header">
        <div class="logo-text">MELBET</div>
        <div class="balance-box">Balance: ৳ <span id="userBalance">0.00</span></div>
    </div>

    <div class="container">
        
        <!-- ডিপোজিট ও উইথড্র বাটন -->
        <div class="action-buttons">
            <a href="deposit.html" class="action-btn deposit-btn">+ Deposit</a>
            <a href="withdraw.html" class="action-btn withdraw-btn">- Withdraw</a>
        </div>

        <!-- গেমের তালিকা সেকশন -->
        <h3 style="color: #8b9bb4; margin-top: 10px; margin-bottom: 5px;">Popular Games</h3>
        
        <div class="game-card">
            <div class="game-info">
                <h3>✈️ Aviator Game</h3>
                <p>Fly high and win big!</p>
            </div>
            <a href="aviator.html" class="play-btn">PLAY</a>
        </div>

        <!-- লগআউট অপশন -->
        <div class="logout-section">
            <a href="login.html" class="logout-btn">Logout from account</a>
        </div>

    </div>

    <script>
        // লোকাল স্টোরেজ থেকে ইউজারের ব্যালেন্স বা আপডেট দেখানোর কোড
        // (পরে ফায়ারবেজ কানেক্ট করলে এটি রিয়েল-টাইম ডাটা দেখাবে)
        let savedBalance = localStorage.getItem('userBalance');
        if (savedBalance) {
            document.getElementById('userBalance').innerText = savedBalance;
        }
    </script>

</body>
</html>
