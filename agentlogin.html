<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melbet - Agent Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f141c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 90%;
            max-width: 380px;
            background: #18222d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #223041;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #e6c619;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }
        label {
            font-size: 14px;
            color: #8b9bb4;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #223041;
            border-radius: 5px;
            background: #223041;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #ff0000;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #cc0000;
        }
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .back-link a {
            color: #8b9bb4;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Agent Portal Login</h2>
        <div class="form-group">
            <label>Agent Username</label>
            <input type="text" id="agentUsername" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label>Agent Password</label>
            <input type="password" id="agentPassword" placeholder="Enter password">
        </div>
        <button class="login-btn" onclick="loginAgent()">LOGIN</button>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        function loginAgent() {
            let user = document.getElementById('agentUsername').value;
            let pass = document.getElementById('agentPassword').value;
            
            // আপনার দেওয়া নতুন ইউজারনেম এবং পাসওয়ার্ড চেক করা হচ্ছে
            if (user === "riyad@890098" && pass === "Pass.alomgir33312321@@@") {
                localStorage.setItem('isAgentLoggedIn', 'true');
                window.location.href = "agent.html";
            } else {
                alert("Incorrect Username or Password!");
            }
        }
    </script>

</body>
</html>
