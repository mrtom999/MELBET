<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melbet - Aviator Lobby</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f141c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .lobby-card {
            width: 90%;
            max-width: 400px;
            background: #18222d;
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #223041;
        }
        .logo-img {
            font-size: 60px;
            margin-bottom: 15px;
        }
        h1 {
            color: #ff0000;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        p {
            color: #8b9bb4;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .play-now-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .play-now-btn:hover {
            background-color: #218838;
        }
        .back-link {
            margin-top: 20px;
        }
        .back-link a {
            color: #8b9bb4;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="lobby-card">
        <div class="logo-img">✈️</div>
        <h1>AVIATOR</h1>
        <p>Fly high, multiply your bet, and cash out before it crashes!</p>
        
        <!-- প্লে নাও বাটন যা সরাসরি বিমান ওড়ার পেজে নিয়ে যাবে -->
        <a href="aviator-game.html" class="play-now-btn">PLAY NOW</a>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

</body>
</html>
